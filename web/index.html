<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The picture an iPad's home screen shows (favicon.svg at 180 px). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No pinch zoom: a tablet held by a six-year-old zooms by accident. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- The browser bar takes the tube's colour (--tube in index.css). -->
    <meta name="theme-color" content="#05030f" />
    <!-- Added to an iPad's home screen, it opens full screen like a cabinet. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Arcade" />
    <title>Schoolhouse Arcade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
